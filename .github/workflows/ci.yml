name: CI & Deploy

on:
  push:
    # Only main and the beta/next integration branch deploy. main -> root site,
    # beta/next -> /beta/. No other branch can touch the deployed site.
    branches: [main, 'beta/next']
  pull_request:
    # Run CI for feature PRs into beta/next as well as PRs into main, and for
    # backports into a release branch — without this a bad backport is not
    # caught until the release PR itself runs, which is after it has already
    # landed on the release branch.
    #
    # Safe to widen here but NOT in `push` above: `build` and `deploy` are both
    # gated on `github.event_name == 'push'`, so a pull_request event can only
    # ever reach the `ci` job. (`version-guard` gates on
    # `github.base_ref == 'main'`, so it stays off backport PRs — the version
    # bump belongs to the release PR, not to each backport into it.)
    branches: [main, 'beta/next', 'release/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Scope by event type so a `pull_request` sync run can't preempt the
  # `push` run that actually does the deploy (the `build` and `deploy`
  # jobs below are gated on `github.event_name == 'push'`).
  #
  # AND by branch: `push` fires on both `main` and `beta/next`, so an
  # event-only group put them in the same bucket and the later push killed
  # the earlier run. That bit the 1.2.0 release — pushing `beta/next` back
  # after the merge (which the release runbook tells you to do) cancelled
  # the `main` deploy 12s in. Same-branch pushes still supersede each
  # other, which is what you want; cross-branch ones no longer do.
  group: pages-${{ github.event_name }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2

      # `#[rustfmt::skip]` guards the 6502 listings, whose comment alignment is
      # load-bearing — see the commit that added them. Everything else is
      # rustfmt style per rustfmt.toml.
      - name: Formatting
        run: cargo fmt --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      # The native pass above never evaluates the `cfg(target_arch = "wasm32")`
      # branch, and `wasm-pack` (in the `build` job) exits 0 on warnings — so
      # without this, a wasm-only warning is invisible and a wasm-only compile
      # error first surfaces post-merge, in the job that deploys.
      # `--lib` is required: the bins pull in clap, which isn't built for wasm.
      - name: Clippy — wasm target (deny warnings)
        run: cargo clippy --lib --target wasm32-unknown-unknown -- -D warnings

      - name: Build
        run: cargo build --all-targets

      - name: Test
        run: cargo test

      # Advisory only: flags ROM offsets that bypass their rom_data.rs constant.
      # `continue-on-error` keeps the job green — this surfaces a nudge in the
      # step summary without blocking merges.
      - name: ROM offset duplication scan (advisory)
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 tools/offset_dups.py --exit-code | tee -a "$GITHUB_STEP_SUMMARY"

  version-guard:
    # Every PR to main must bump the Cargo.toml version. The title-screen seed
    # hash folds in CARGO_PKG_VERSION, so a version bump is what makes two builds
    # with different randomization logic produce different verification icons.
    # Only enforced for PRs targeting main (the release PR beta/next -> main, or
    # any direct-to-main PR) — feature PRs into beta/next don't each need a bump.
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # need base history to read main's Cargo.toml
      - name: Require a version bump
        shell: bash
        run: |
          set -euo pipefail
          ver() { sed -n 's/^version = "\(.*\)"/\1/p' "$1" | head -1; }
          git show '${{ github.event.pull_request.base.sha }}:Cargo.toml' > /tmp/base-cargo.toml
          base=$(ver /tmp/base-cargo.toml)
          head=$(ver Cargo.toml)
          echo "base version: $base"
          echo "head version: $head"
          if [ "$base" = "$head" ]; then
            echo "::error file=Cargo.toml::Version unchanged ($head). Bump the version before merging to main."
            exit 1
          fi
          # Enforce a strictly-increasing version (highest sorts last).
          highest=$(printf '%s\n%s\n' "$base" "$head" | sort -V | tail -1)
          if [ "$highest" != "$head" ]; then
            echo "::error file=Cargo.toml::Version $head is not greater than main's $base."
            exit 1
          fi

  build:
    needs: ci
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # `contents: write` so the archive step can push frozen version snapshots to
    # the `site-versions` branch. `pages`/`id-token` retained for the artifact.
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          path: main-src

      - name: Build main
        working-directory: main-src
        run: wasm-pack build --target web --out-dir pkg

      - name: Stage main into _site/
        run: |
          mkdir -p _site
          cp -r main-src/web/. _site/
          cp -r main-src/pkg _site/pkg

      # Beta page: ALWAYS built from the beta/next integration branch, whatever
      # triggered this run. This locks /beta/ to beta/next and keeps it stable —
      # a main deploy no longer wipes it, and no other branch can clobber it.
      #
      # Except on a release run: merging beta/next -> main auto-deletes the head
      # branch, so for that one run beta/next doesn't exist and checking it out
      # fails the whole deploy. Fall back to main, which is what recreating
      # beta/next would give us anyway — right after a release the two are the
      # same commit.
      - name: Resolve the beta ref
        id: beta-ref
        working-directory: main-src
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin beta/next >/dev/null 2>&1; then
            echo "ref=beta/next" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::beta/next is missing (a release merge deletes it) — building /beta/ from main"
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout beta/next
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.beta-ref.outputs.ref }}
          path: beta-src

      - name: Build beta/next
        working-directory: beta-src
        run: wasm-pack build --target web --out-dir pkg

      - name: Stage beta/next into _site/beta/
        run: |
          mkdir -p _site/beta
          cp -r beta-src/web/. _site/beta/
          cp -r beta-src/pkg _site/beta/pkg

      # Freeze each main version at /v/<version>/ and carry the whole archive
      # forward into every deploy. Only the current version is ever built (above);
      # prior versions are copied verbatim from the `site-versions` branch, so
      # build time stays flat no matter how many versions accumulate.
      - name: Archive version snapshot and stage version history
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER=$(sed -n 's/^version = "\(.*\)"/\1/p' main-src/Cargo.toml | head -1)
          echo "Main version: $VER"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # Fetch the archive branch, or start it empty if it does not exist yet.
          if git clone --branch site-versions --single-branch "$REMOTE" versions-repo 2>/dev/null; then
            echo "Fetched site-versions branch."
          else
            echo "site-versions branch absent; creating a fresh archive."
            git clone "$REMOTE" versions-repo
            ( cd versions-repo
              git checkout --orphan site-versions
              git rm -rf . >/dev/null 2>&1 || true
              mkdir -p v )
          fi

          cd versions-repo
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Snapshot only from a main push, and only once per version (never overwrite).
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [ ! -d "v/$VER" ]; then
            mkdir -p "v/$VER"
            cp -r ../main-src/web/. "v/$VER/"
            cp -r ../main-src/pkg   "v/$VER/pkg"
            # wasm-pack writes a `pkg/.gitignore` containing `*`, which makes
            # `git add` skip the entire WASM bundle and leaves the frozen
            # snapshot with an empty pkg/ (so its app fails to boot). Drop that
            # ignore file and force-add so the snapshot actually ships its pkg/.
            rm -f "v/$VER/pkg/.gitignore"
            git add -Af "v/$VER"
            git commit -m "archive v$VER"
            git push origin site-versions
            echo "Archived v$VER."
          else
            echo "No new snapshot (ref=$GITHUB_REF, v/$VER exists: $( [ -d "v/$VER" ] && echo yes || echo no ))."
          fi
          cd ..

          # Carry every archived version into the deploy (file copy, no rebuild).
          mkdir -p _site/v
          if [ -n "$(ls -A versions-repo/v 2>/dev/null)" ]; then
            cp -r versions-repo/v/. _site/v/
          fi

          # Manifest for the in-app version picker (newest first).
          #
          # `current` comes from the ARCHIVE, not from main's Cargo.toml. Every
          # run writes this file, including runs triggered by `beta/next` — and
          # those skip the snapshot above, so reading Cargo.toml let a beta push
          # advertise a version that had never been archived. That happened on
          # 1.2.0: the main run was cancelled before it snapshotted, the beta run
          # that replaced it published `current: 1.2.0` against an archive whose
          # newest entry was 1.1.0, and /v/1.2.0/ 404'd from the picker.
          # Newest-archived is always the version the root is serving, because
          # the snapshot above runs before this line on the main push that
          # produced that root.
          ARR=$(ls versions-repo/v 2>/dev/null | sort -Vr | sed 's/.*/"&"/' | paste -sd, -)
          CUR=$(ls versions-repo/v 2>/dev/null | sort -V | tail -1)
          CUR=${CUR:-$VER}   # empty archive (first ever run): fall back to main's version

          # `flagKeyVersion` is the flag-key FORMAT version the app at the root
          # reads. It is what lets the racetime seed bot
          # (github.com/../smb3r-seedbot) reject a racer's stale key before it
          # posts the seed link, instead of posting a link that every racer's
          # browser then refuses — leaving each of them to generate from their
          # own leftover settings. Pre-v29 keys carry no checksum, so the bot's
          # structural checks cannot catch them; only a version comparison can.
          # Absent or non-integer, the bot soft-fails to structural checks only,
          # which is the behaviour this replaces.
          #
          # Read from main-src, NOT from the archive, and the difference from
          # `CUR` above is deliberate. The two answer different questions:
          # `current` names an archive entry the picker will link to, so it MUST
          # come from the archive or it links a 404. `flagKeyVersion` describes
          # the code that will actually accept or reject the key at `/`, and the
          # root is staged from main-src (see "Stage main into _site/"), so
          # main-src is the honest source. In the window where main is ahead of
          # the archive these disagree, and each is still right about its own
          # question.
          FKV=$(sed -n 's/.*FLAG_KEY_VERSION: u8 = \([0-9]*\).*/\1/p' \
                  main-src/src/randomizer/flag_key.rs | head -1)
          if [ -z "$FKV" ]; then
            echo "::error::Could not read FLAG_KEY_VERSION from src/randomizer/flag_key.rs."
            echo "::error::If the constant was renamed or moved, update this step to match."
            exit 1
          fi
          echo "Flag-key format version: $FKV"

          printf '{"current":"%s","flagKeyVersion":%s,"versions":[%s]}\n' \
            "$CUR" "$FKV" "$ARR" > _site/versions.json
          cat _site/versions.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
