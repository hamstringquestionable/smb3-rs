[package]
name = "smb3-rs"
version = "1.3.0"
edition = "2024"
description = "Super Mario Bros. 3 randomizer — outputs an IPS patch or a patched ROM"
repository = "https://github.com/hamstringquestionable/smb3-rs"
license = "MIT"

[lib]
name = "smb3_rs"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "smb3-rs"
path = "src/main.rs"

# Playtest ROM builder. Native-only tooling; not part of the web build.
[[bin]]
name = "testrom"
path = "src/bin/testrom.rs"

[dependencies]
modular-bitfield = "0.13"
rand = "0.9"
rand_chacha = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "4", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
base32 = "0.5"
mos6502 = "0.10.1"

[profile.release]
# One codegen unit instead of the default 16.
#
# **Measured, and it is not a small effect**: WASM `generate_patch` went from
# 97.7 to 86.2 ms mean with the maze off, and 122.9 to 109.5 with it on (40
# seeds, 2026-09-09). Everything is in one large crate, so what the default
# costs is cross-module inlining *inside* it — the builder's hot loops call
# across `map_walker`, `route_choice` and `overworld_build` constantly.
#
# LTO was measured on top of this and adds **nothing** (fat 86.0, thin 85.8,
# neither distinguishable from 86.2), which is what you would expect when there
# is essentially one crate to link. It is left off so the build stays as fast as
# it can: this alone roughly doubles a wasm-pack release build, to ~30s.
#
# Output is unchanged — a codegen setting cannot alter program semantics, and
# `output_matches_baseline` confirms it against the committed hash.
codegen-units = 1
